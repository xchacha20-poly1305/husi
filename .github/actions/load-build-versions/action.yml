name: Load build versions
description: Export toolchain versions from buildScript/init/version.sh
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        source buildScript/init/version.sh
        for name in GO_VERSION RUST_VERSION JAVA_VERSION JBR_VERSION JBR_BUILD ANDROID_NDK_VERSION ZIG_VERSION NFPM_VERSION APPIMAGETOOL_VERSION APPIMAGE_RUNTIME_VERSION PROTOC_VERSION GEOIP_VERSION GEOSITE_VERSION; do
          echo "$name=${!name}" >> "$GITHUB_ENV"
        done
