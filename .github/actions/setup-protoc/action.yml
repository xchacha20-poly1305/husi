name: Setup protoc
description: Install the Linux x86_64 protobuf compiler pinned by PROTOC_VERSION.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        : "${PROTOC_VERSION:?Run load-build-versions before setup-protoc}"
        if [[ "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 ]]; then
          echo "setup-protoc requires a Linux x86_64 runner" >&2
          exit 1
        fi
    - uses: actions/cache@v6
      id: cache
      with:
        path: build/protoc/${{ env.PROTOC_VERSION }}
        key: protoc-${{ runner.os }}-${{ runner.arch }}-${{ env.PROTOC_VERSION }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        install_directory="$GITHUB_WORKSPACE/build/protoc/$PROTOC_VERSION"
        archive_directory=$(mktemp -d)
        trap 'rm -rf "$archive_directory"' EXIT
        gh release download "v$PROTOC_VERSION" --repo protocolbuffers/protobuf \
          --pattern "protoc-$PROTOC_VERSION-linux-x86_64.zip" --dir "$archive_directory"
        mkdir -p "$install_directory"
        unzip -q "$archive_directory/protoc-$PROTOC_VERSION-linux-x86_64.zip" -d "$install_directory"
    - shell: bash
      run: |
        compiler_directory="$GITHUB_WORKSPACE/build/protoc/$PROTOC_VERSION/bin"
        echo "$compiler_directory" >> "$GITHUB_PATH"
        "$compiler_directory/protoc" --version
