name: Test

on:
  push:
    branches:
      - 'dev*'
    paths:
      - .github/actions/**
      - .github/workflows/test.yml
      - androidApp/**
      - buildScript/**
      - buildSrc/**
      - composeApp/**
      - gradle/**
      - launcher/**
      - libcore/**
      - library/**
      - run
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/test.yml
      - androidApp/**
      - buildScript/**
      - buildSrc/**
      - composeApp/**
      - gradle/**
      - launcher/**
      - libcore/**
      - library/**
      - run

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Lint shell scripts
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          shellcheck run
          find buildScript -name '*.sh' -exec shellcheck {} +
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/load-build-versions
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: burrunan/gradle-cache-action@v3
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: 'libcore/go.sum'
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: launcher-test
      - name: Checkout cronet-go
        uses: actions/checkout@v7
        with:
          repository: SagerNet/cronet-go
          ref: ${{ env.CRONET_GO_COMMIT }}
          path: cronet-go
          submodules: recursive
          fetch-depth: 1
      - name: Cache cronet toolchain
        uses: actions/cache@v6
        with:
          path: |
            cronet-go/naiveproxy/src/third_party/llvm-build
            cronet-go/naiveproxy/src/gn/out
            cronet-go/naiveproxy/src/chrome/build/pgo_profiles
            cronet-go/naiveproxy/src/out/sysroot-build
          key: cronet-toolchain-${{ runner.os }}-${{ runner.arch }}-linux_amd64-${{ env.CRONET_GO_COMMIT }}
      - name: Cache route assets
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: composeApp/src/commonMain/composeResources/files/sing-box
          key: assets-${{ env.GEOIP_VERSION }}-${{ env.GEOSITE_VERSION }}
      - name: Prepare assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: make assets
      - name: Prepare cronet toolchain
        run: cd cronet-go && go run ./cmd/build-naive --target=linux/amd64 download-toolchain
      - name: Test libcore
        working-directory: libcore
        run: go test -v -count=1 ./...
      - name: Build libcore bindings
        env:
          CRONET_GO_ROOT: ${{ github.workspace }}/cronet-go
        run: |
          make libcore
      - name: Test launcher
        run: cd launcher && zig build test
      - name: Test Kotlin
        env:
          BUILD_PLUGIN: none
        run: ./gradlew :composeApp:allTests --build-cache
