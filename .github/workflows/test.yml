name: Test

on:
  push:
    branches:
      - 'dev*'
    paths:
      - .github/workflows/test.yml
      - androidApp/
      - buildScript/
      - buildSrc/
      - composeApp/
      - gradle/
      - libcore/
      - library/
  pull_request:
    paths:
      - .github/workflows/test.yml
      - androidApp/
      - buildScript/
      - buildSrc/
      - composeApp/
      - gradle/
      - libcore/
      - library/

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/load-build-versions
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Checkout cronet-go
        uses: actions/checkout@v7
        with:
          repository: SagerNet/cronet-go
          ref: ${{ env.CRONET_GO_COMMIT }}
          path: cronet-go
          submodules: recursive
          fetch-depth: 1
      - name: Cache libcore and native toolchains
        uses: actions/cache@v6
        with:
          path: |
            composeApp/libs
            cronet-go/naiveproxy/src/third_party/llvm-build
            cronet-go/naiveproxy/src/gn/out
            cronet-go/naiveproxy/src/chrome/build/pgo_profiles
            cronet-go/naiveproxy/src/out/sysroot-build
          key: libcore-${{ runner.os }}-${{ runner.arch }}-${{ env.CRONET_GO_COMMIT }}-${{ hashFiles('libcore/go.sum', 'libcore/build.sh', 'husi.properties') }}
          restore-keys: libcore-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare assets and cronet toolchain
        run: |
          make assets
          (cd cronet-go && go run ./cmd/build-naive --target=linux/amd64 download-toolchain)
      - name: Test libcore
        working-directory: libcore
        run: go test -v -count=1 ./...
      - name: Build libcore bindings
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CRONET_GO_ROOT: ${{ github.workspace }}/cronet-go
        run: |
          make libcore
      - name: Test Kotlin
        env:
          BUILD_PLUGIN: none
        run: ./gradlew :composeApp:allTests --no-daemon
