name: Test

on:
  push:
    branches:
      - 'dev*'
    paths:
      - .github/actions/**
      - .github/workflows/test.yml
      - androidApp/**
      - buildScript/**
      - buildSrc/**
      - composeApp/**
      - gradle/**
      - launcher/**
      - libcore/**
      - library/**
      - Makefile
      - proto/**
      - release/**
      - run
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/test.yml
      - androidApp/**
      - buildScript/**
      - buildSrc/**
      - composeApp/**
      - gradle/**
      - launcher/**
      - libcore/**
      - library/**
      - Makefile
      - proto/**
      - release/**
      - run

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Lint shell scripts
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          # -x follows the `# shellcheck source=` directives into sourced files.
          shellcheck -x run
          find buildScript release -name '*.sh' -exec shellcheck -x {} +

  lint-go:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - uses: ./.github/actions/load-build-versions
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: 'libcore/go.sum'
      # The Windows pass needs a cgo cross compiler to typecheck the Win32 files.
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: lint-go
      - name: Install golangci-lint
        run: make lint_go_install
      - name: Lint libcore
        run: make lint_go

  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/load-build-versions
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: 'libcore/go.sum'
      - name: Install protoc
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          rm /tmp/protoc.zip
      - name: Regenerate protocol
        run: make proto
      - name: Check the generated tree is up to date
        run: git diff --exit-code && test -z "$(git status --porcelain)"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: burrunan/gradle-cache-action@v3
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: launcher-test
      - name: Checkout cronet-go
        uses: actions/checkout@v7
        with:
          repository: SagerNet/cronet-go
          ref: ${{ env.CRONET_GO_COMMIT }}
          path: cronet-go
          submodules: recursive
          fetch-depth: 1
      - name: Cache cronet toolchain
        uses: actions/cache@v6
        with:
          path: |
            cronet-go/naiveproxy/src/third_party/llvm-build
            cronet-go/naiveproxy/src/gn/out
            cronet-go/naiveproxy/src/chrome/build/pgo_profiles
            cronet-go/naiveproxy/src/out/sysroot-build
          key: cronet-toolchain-${{ runner.os }}-${{ runner.arch }}-linux_amd64-${{ env.CRONET_GO_COMMIT }}
      - name: Prepare cronet toolchain
        run: cd cronet-go && go run ./cmd/build-naive --target=linux/amd64 download-toolchain
      - name: Test libcore
        working-directory: libcore
        run: go test -v -count=1 ./...
      # Desktop core host is the Zig shim + anja sidecar — forbid a second Go link.
      - name: Guard no go-built husi-core binary
        run: make test_no_go_core_binary
      - name: Build libcore bindings
        env:
          CRONET_GO_ROOT: ${{ github.workspace }}/cronet-go
        run: |
          make libcore
      - name: Test Zig projects
        run: make test_zig
      - name: Test Kotlin
        env:
          BUILD_PLUGIN: none
        run: ./gradlew :composeApp:allTests --build-cache
