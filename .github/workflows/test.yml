name: Test

on:
  push:
    branches:
      - 'dev*'
    paths:
      - .github/actions/**
      - .github/workflows/test.yml
      - androidApp/**
      - buildScript/**
      - buildSrc/**
      - composeApp/**
      - gradle/**
      - gradle.properties
      - launcher/**
      - libcore/**
      - library/**
      - Makefile
      - proto/**
      - release/**
      - run
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/test.yml
      - androidApp/**
      - buildScript/**
      - buildSrc/**
      - composeApp/**
      - gradle/**
      - gradle.properties
      - launcher/**
      - libcore/**
      - library/**
      - Makefile
      - proto/**
      - release/**
      - run

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Lint shell scripts
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          # -x follows the `# shellcheck source=` directives into sourced files.
          shellcheck -x run
          find buildScript release -name '*.sh' -exec shellcheck -x {} +

  lint-go:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - uses: ./.github/actions/load-build-versions
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: 'libcore/go.sum'
      # The Windows pass needs a cgo cross compiler to typecheck the Win32 files.
      - uses: ./.github/actions/setup-zig
        with:
          cache-name: lint-go
      - name: Install golangci-lint
        run: make lint_go_install
      - name: Lint libcore
        run: make lint_go

  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/load-build-versions
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: 'libcore/go.sum'
      - name: Install protoc
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          rm /tmp/protoc.zip
      - name: Regenerate protocol
        run: make proto
      - name: Check the generated tree is up to date
        run: git diff --exit-code && test -z "$(git status --porcelain)"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: ./.github/actions/gradle-cache
      - uses: ./.github/actions/setup-zig
        with:
          cache-name: test
          cache-hash: ${{ hashFiles('launcher/**', 'libcore/shim/**') }}
      - name: Test libcore
        working-directory: libcore
        run: go test -v -count=1 ./...
      # Desktop core host is the Zig shim + anja sidecar — forbid a second Go link.
      - name: Guard no go-built husi-core binary
        run: make test_no_go_core_binary
      - name: Build libcore bindings
        run: |
          make libcore
      - name: Test Zig projects
        run: make test_zig
      - name: Test Kotlin
        env:
          BUILD_PLUGIN: none
        run: ./gradlew :composeApp:allTests --build-cache
