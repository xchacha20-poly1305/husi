syntax = "proto3";

package mieruproto;

option go_package = "libcore/plugin/mieruproto;mieruproto";

message TrafficPattern {

    // Generate stable implicit traffic patterns that are not explictly set.
    // Generated traffic patterns are also influenced by "unlockAll" below.
    optional int32 seed = 1;

    // If true, implicit traffic patterns can use all possible options,
    // which may not be desired. Otherwise, implicit traffic patterns
    // only use limited options.
    // All explicitly set traffic patterns are available regardless of this.
    optional bool unlockAll = 2;

    // Split TCP packets by fragmentation.
    optional TCPFragment tcpFragment = 3;

    // Manipulate nonce prefix.
    optional NoncePattern nonce = 4;

    // Define padding behavior.
    optional PaddingPattern padding = 5;

    // Define low entropy traffic behavior.
    optional LowEntropyPattern lowEntropy = 6;
}

message TCPFragment {

    // Enable additional TCP fragmentation.
    optional bool enable = 1;

    // Max sleep time in milliseconds between sending two fragments.
    // This value can't exceed 100.
    // If not set, a reasonable default value is used.
    optional int32 maxSleepMs = 2;
}

message NoncePattern {

    // Strategy to manipulate nonce.
    optional NonceType type = 1;

    // If the pattern applies to each UDP packet,
    // or only applies to the first UDP packet.
    optional bool applyToAllUDPPacket = 2;

    // Minimum number of bytes to manipulate.
    // It is ignored when NonceType is NONCE_TYPE_RANDOM or NONCE_TYPE_FIXED.
    optional int32 minLen = 3;

    // Maximum number of bytes to manipulate.
    // This value can't exceed 12.
    // It is ignored when NonceType is NONCE_TYPE_RANDOM or NONCE_TYPE_FIXED.
    optional int32 maxLen = 4;

    // A list of hex string (without 0x) that represent customized
    // nonce prefix to use. For example, string "00010203"
    // represent a 4 bytes nonce prefix [0, 1, 2, 3].
    //
    // Each nonce prefix can't exceed 12 bytes.
    //
    // When multiple strings are provided, a random one is used each time.
    //
    // It has no effect when NonceType is not NONCE_TYPE_FIXED.
    repeated string customHexStrings = 5;
}

enum NonceType {

    // Do not make change to the original random nonce.
    NONCE_TYPE_RANDOM = 0;

    // Use printable ASCII characters from 0x20 to 0x7E.
    NONCE_TYPE_PRINTABLE = 1;

    // Use a pre-defined subset of printable ASCII characters.
    NONCE_TYPE_PRINTABLE_SUBSET = 2;

    // Use a customized nonce prefix.
    // If field customHexStrings is not set in NoncePattern,
    // the behavior is the same as NONCE_TYPE_RANDOM.
    NONCE_TYPE_FIXED = 3;
}

message PaddingPattern {

    // Maximum number of padding bytes in the middle of a network segment.
    // The valid range is [0, 255].
    // Set it to 0 to disable middle padding.
    // It not set, an internal value is used.
    optional int32 maxMiddlePaddingLen = 1;

    // Maximum number of padding bytes at the end of a network segment.
    // The valid range is [0, 255].
    // Set it to 0 to disable end padding.
    // It not set, an internal value is used.
    optional int32 maxEndPaddingLen = 2;
}

message LowEntropyPattern {

    // If low entropy is enabled, and how much entropy is reduced.
    optional LowEntropyMode mode = 1;

    // Low entropy uses a 64-bit long mask to determine the position of padding bits.
    // This determines how to rotate the mask between two adjacent chunks.
    // It has no effect if low entropy mode is disabled.
    optional LowEntropyMaskRotation maskRotation = 2;
}

enum LowEntropyMode {

    // Low entropy is disabled.
    LOW_ENTROPY_MODE_OFF = 0;

    // 32 bits of data is encoded into 64 bits chunk.
    // 32 bits padding is added.
    LOW_ENTROPY_MODE_32 = 1;

    // 40 bits of data is encoded into 64 bits chunk.
    // 24 bits padding is added.
    LOW_ENTROPY_MODE_40 = 2;

    // 48 bits of data is encoded into 64 bits chunk.
    // 16 bits padding is added.
    LOW_ENTROPY_MODE_48 = 3;

    // 56 bits of data is encoded into 64 bits chunk.
    // 8 bits padding is added.
    LOW_ENTROPY_MODE_56 = 4;
}

enum LowEntropyMaskRotation {
    // Mask doesn't change for each 64 bits chunk.
    LOW_ENTROPY_MASK_NO_ROTATION = 0;

    // The 4 least significant bits determine how many bits to rotate right
    // for each 64 bits chunk.
    LOW_ENTROPY_MASK_ROTATE_RIGHT_1 = 1;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_2 = 2;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_3 = 3;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_4 = 4;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_5 = 5;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_6 = 6;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_7 = 7;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_8 = 8;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_9 = 9;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_10 = 10;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_11 = 11;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_12 = 12;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_13 = 13;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_14 = 14;
    LOW_ENTROPY_MASK_ROTATE_RIGHT_15 = 15;

    // The 4 most significant bits determine how many bits to rotate left
    // for each 64 bits chunk.
    LOW_ENTROPY_MASK_ROTATE_LEFT_1 = 16;
    LOW_ENTROPY_MASK_ROTATE_LEFT_2 = 32;
    LOW_ENTROPY_MASK_ROTATE_LEFT_3 = 48;
    LOW_ENTROPY_MASK_ROTATE_LEFT_4 = 64;
    LOW_ENTROPY_MASK_ROTATE_LEFT_5 = 80;
    LOW_ENTROPY_MASK_ROTATE_LEFT_6 = 96;
    LOW_ENTROPY_MASK_ROTATE_LEFT_7 = 112;
    LOW_ENTROPY_MASK_ROTATE_LEFT_8 = 128;
    LOW_ENTROPY_MASK_ROTATE_LEFT_9 = 144;
    LOW_ENTROPY_MASK_ROTATE_LEFT_10 = 160;
    LOW_ENTROPY_MASK_ROTATE_LEFT_11 = 176;
    LOW_ENTROPY_MASK_ROTATE_LEFT_12 = 192;
    LOW_ENTROPY_MASK_ROTATE_LEFT_13 = 208;
    LOW_ENTROPY_MASK_ROTATE_LEFT_14 = 224;
    LOW_ENTROPY_MASK_ROTATE_LEFT_15 = 240;
}