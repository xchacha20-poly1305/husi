<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182035">
  <title>Husi</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      margin: auto;
      width: 32px;
      height: 32px;
      border: 3px solid #8884;
      border-top-color: #888;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading { animation: none; }
    }
  </style>
  <script src="rpc.js"></script>
  <script src="husi.js" defer></script>
</head>
<body>
  <div id="loading" aria-hidden="true"></div>
</body>
</html>
